  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { font-family: 'Poppins', sans-serif; background-color: #f8f9fa; }
    .navbar { background-color: #000; }
    .navbar-brand, .nav-link { color: #fff !important; }
    footer { background-color: #000; color: #fff; text-align: center; padding: 20px 0; margin-top: 50px; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Kimono Fight</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="produtos.html">Produtos</a></li>
        <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
        <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
      </ul>
    </div>
  </div>
</nav>

<section class="container my-5" style="padding-top: 80px;">
  <div class="text-center mb-4">
    <h2 class="fw-bold">Fale Conosco</h2>
    <p>Dúvidas, pedidos ou parcerias? Envie uma mensagem!</p>
  </div>

  <form class="row g-3 justify-content-center">
    <div class="col-md-5">
      <input type="text" class="form-control" placeholder="Seu nome" required>
    </div>
    <div class="col-md-5">
      <input type="email" class="form-control" placeholder="Seu e-mail" required>
    </div>
    <div class="col-md-10">
      <textarea class="form-control" rows="4" placeholder="Sua mensagem" required></textarea>
    </div>
    <div class="col-md-10 text-center">
      <button type="submit" class="btn btn-dark btn-lg">Enviar</button>
    </div>
  </form>
</section>

<footer>
  <p>© 2025 Kimono Fight | Todos os direitos reservados.</p>
